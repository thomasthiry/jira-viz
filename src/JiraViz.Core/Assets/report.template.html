<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jira portfolio status</title>
<script>
// Dark is the default theme; a saved choice overrides it. This runs before first paint, so a
// viewer who has chosen light never sees a dark flash on load.
(function () {
  try {
    var saved = localStorage.getItem("jiraviz-theme");
    document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
  } catch (err) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
<style>
/* ---------------------------------------------------------------------------
   Design tokens.

   Progress uses the conventional red / amber / green status colours: red = to do,
   amber = in progress, green = done. These are the fixed status steps, identical in
   both themes, so a bar means the same thing whichever theme it is read in.

   Red and green are the classic colour-blind confusion pair, so the bar is never the
   only cue: segments are always ordered done, in progress, to do; the completion
   percentage sits beside every bar; and the legend and badges carry words.
   --------------------------------------------------------------------------- */
:root {
  color-scheme: light;

  --plane:          #f9f9f7;
  --surface:        #fcfcfb;
  --surface-sunken: #f2f1ed;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --baseline:       #c3c2b7;
  --border:         rgba(11, 11, 11, 0.10);

  /* Status colours - fixed, never themed, so they read identically in both modes. */
  --critical: #d03b3b;
  --warning:  #fab219;
  --good:     #0ca30c;

  /* Interactive blue - deliberately outside the status set, so a link or a focus ring
     never reads as a status. */
  --link: #2a78d6;

  /* The three progress buckets, mapped onto those same status steps. */
  --todo:        var(--critical);
  --inprogress:  var(--warning);
  --done:        var(--good);

  --track: #eceae4;

  --radius: 10px;
  --mark-radius: 4px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --link:           #3987e5;
    --plane:          #0d0d0d;
    --surface:        #1a1a19;
    --surface-sunken: #131312;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255, 255, 255, 0.10);
    --track: #232322;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --link:           #3987e5;
  --plane:          #0d0d0d;
  --surface:        #1a1a19;
  --surface-sunken: #131312;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --border:         rgba(255, 255, 255, 0.10);
  --track: #232322;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--plane);
  color: var(--text-primary);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1440px; margin: 0 auto; padding: 24px 20px 72px; }

/* ---------- header ---------- */

header.top {
  display: flex; flex-wrap: wrap; gap: 16px;
  align-items: flex-start; justify-content: space-between;
  margin-bottom: 20px;
}
header.top h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.subtitle { color: var(--text-secondary); font-size: 13px; margin: 0; }
.subtitle code {
  font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--surface-sunken); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px;
}

.btn {
  font: inherit; font-size: 13px; color: var(--text-secondary);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 11px; cursor: pointer;
}
.btn:hover { color: var(--text-primary); border-color: var(--baseline); }
.btn[aria-pressed="true"] { color: var(--text-primary); border-color: var(--baseline); background: var(--surface-sunken); }



/* ---------- view switcher ----------
   Each pill carries its own completion as a number and as a miniature of the same red/amber/
   green bar used everywhere else, so the switcher is a comparison in its own right: which
   milestone is furthest along is readable without reading any of the figures. A min-width
   keeps the bars close to a common length, which is what makes them comparable at a glance. */
.views { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.view-pill {
  display: inline-flex; flex-direction: column; align-items: stretch; gap: 7px;
  min-width: 152px;
  font: inherit; font-size: 13px; color: var(--text-secondary); text-align: left;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 9px 13px 10px; cursor: pointer;
}
.view-pill:hover { color: var(--text-primary); border-color: var(--baseline); }
.view-pill:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.view-pill .vp-top { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.view-pill .vp-pct { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.view-pill .track { height: 6px; border-radius: 3px; }
.view-pill .bar { border-radius: 3px; }
.view-pill[aria-pressed="true"] {
  color: var(--text-primary); border-color: var(--link);
  background: var(--surface-sunken); font-weight: 600;
}
.view-pill[aria-pressed="true"] .vp-pct { color: var(--text-secondary); }
.view-pill.is-empty .vp-pct { font-style: italic; }
/* ---------- overall progress headline ----------
   The widest block on the page and the first thing read, but aligned with the cards below it
   rather than bleeding to the window edges. */
.overall {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px 18px;
  margin-bottom: 20px;
}
.overall-head {
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 13px;
}
.overall-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--text-muted); font-weight: 600;
}
.overall-pct {
  font-size: 46px; font-weight: 660; letter-spacing: -0.03em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.overall-meta {
  margin-left: auto; text-align: right; color: var(--text-secondary);
  font-size: 13px; font-variant-numeric: tabular-nums;
}
.overall .track, .overall .bar { border-radius: 6px; }
.overall .seg .lab {
  flex-direction: column; gap: 1px; padding: 0 6px;
  font-size: 12px; font-weight: 500; line-height: 1.25;
  overflow: hidden; white-space: nowrap;
}
.overall .seg .lab b { font-size: 15.5px; font-weight: 680; }

@media (max-width: 620px) {
  .overall-pct { font-size: 36px; }
  .overall-meta { margin-left: 0; text-align: left; width: 100%; }
}
/* ---------- KPI strip ---------- */

.kpis {
  display: grid; gap: 12px; margin-bottom: 20px;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
}
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
}
.kpi .label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-muted); margin-bottom: 6px;
}
.kpi .value { font-size: 26px; font-weight: 640; line-height: 1.1; letter-spacing: -0.02em; }
.kpi .note { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ---------- cards & controls ---------- */

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px;
}
.card > h2 {
  margin: 0 0 2px; font-size: 15px; font-weight: 620; letter-spacing: -0.01em;
}
.card > .hint { margin: 0 0 14px; font-size: 12.5px; color: var(--text-secondary); }

.controls {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-bottom: 14px;
}
.controls input[type="search"], .controls select {
  font: inherit; font-size: 13px; color: var(--text-primary);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; min-width: 150px;
}
.controls input[type="search"] { min-width: 220px; flex: 1 1 220px; max-width: 360px; }
.controls label { font-size: 12.5px; color: var(--text-secondary); }

/* ---------- legend ---------- */

.legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
.swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.swatch.done { background: var(--done); }
.swatch.inprogress { background: var(--inprogress); }
.swatch.todo { background: var(--todo); }

/* ---------- stacked progress bar ---------- */

.track {
  background: var(--track); border-radius: var(--mark-radius);
  height: 18px; overflow: hidden;
}
.bar {
  display: flex; height: 100%; gap: 2px;      /* 2px surface gap between fills */
  border-radius: var(--mark-radius); overflow: hidden;
}
.seg { height: 100%; min-width: 0; }
.seg.done { background: var(--done); }
.seg.inprogress { background: var(--inprogress); }
.seg.todo { background: var(--todo); }
.bar .seg:first-child { border-top-left-radius: var(--mark-radius); border-bottom-left-radius: var(--mark-radius); }
.bar .seg:last-child { border-top-right-radius: var(--mark-radius); border-bottom-right-radius: var(--mark-radius); }


/* ---------- epic rows ---------- */

.epic { border-top: 1px solid var(--gridline); }
.epic:first-child { border-top: 0; }

.epic-head {
  display: grid; align-items: center; gap: 14px;
  grid-template-columns: 18px minmax(190px, 1.5fr) minmax(260px, 3fr) 58px 78px;
  padding: 10px 6px; cursor: pointer; border: 0; width: 100%;
  background: none; color: inherit; font: inherit; text-align: left;
}

/* Values printed inside a segment, shown only where there is room for them. */
.seg { position: relative; }
.seg .lab {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.seg.done .lab, .seg.todo .lab { color: rgba(255, 255, 255, 0.95); }
.seg.inprogress .lab { color: rgba(0, 0, 0, 0.8); }
.epic-head:hover { background: var(--surface-sunken); }
.epic-head:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }

.chev { color: var(--text-muted); transition: transform 0.12s ease; font-size: 11px; }
.epic.open .chev { transform: rotate(90deg); }

.epic-name { min-width: 0; }
.epic-name .key {
  font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--text-muted);
}
.epic-name .summary {
  display: block; font-weight: 560; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

.pct { font-weight: 620; font-size: 15.5px; text-align: right; font-variant-numeric: tabular-nums; }
.size { color: var(--text-secondary); text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* The bar cell is scaled by epic size when that mode is on, so a large untouched
   epic is physically the longest pale bar on the page. */
.barcell { min-width: 0; }
.barcell .scaler { transition: width 0.2s ease; }

/* ---------- badges ---------- */

.badges { display: inline-flex; flex-wrap: wrap; gap: 5px; vertical-align: middle; margin-left: 6px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 560; letter-spacing: 0.01em;
  padding: 1px 6px 1px 5px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--text-secondary);
  background: var(--surface-sunken); white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.badge.risk .dot { background: var(--critical); }
.badge.stalled .dot { background: var(--warning); }
.badge.unestimated .dot { background: var(--text-muted); }
.badge.complete .dot { background: var(--good); }

/* ---------- expanded detail ---------- */

.detail { display: none; padding: 2px 6px 14px 32px; }
.epic.open .detail { display: block; }

.story { border-top: 1px solid var(--gridline); }
.story-head {
  display: grid; align-items: center; gap: 12px;
  grid-template-columns: 14px minmax(180px, 2.2fr) minmax(90px, 1.1fr) minmax(120px, 1.6fr) 52px;
  padding: 7px 4px; width: 100%; border: 0; background: none;
  color: inherit; font: inherit; text-align: left; cursor: default;
}
.story-head.expandable { cursor: pointer; }
.story-head.expandable:hover { background: var(--surface-sunken); }
.story-head:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }

.story .title { min-width: 0; display: flex; align-items: baseline; gap: 7px; }
.story .title .summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

a.key {
  font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--link); text-decoration: none; flex: none;
}
a.key:hover { text-decoration: underline; }

.status-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--text-secondary); white-space: nowrap;
}
.subtasks { padding: 2px 0 8px 26px; display: none; }
.story.open .subtasks { display: block; }
.subtask {
  display: grid; align-items: center; gap: 12px;
  grid-template-columns: minmax(160px, 2.4fr) minmax(90px, 1.2fr) 96px;
  padding: 4px 4px; font-size: 12.5px; color: var(--text-secondary);
  border-top: 1px solid var(--gridline);
}
.subtask .title { min-width: 0; display: flex; align-items: baseline; gap: 7px; }
.subtask .summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who { color: var(--text-muted); font-size: 12px; text-align: right; white-space: nowrap;
       overflow: hidden; text-overflow: ellipsis; }

/* ---------- tables ---------- */

table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th {
  text-align: left; font-weight: 560; color: var(--text-muted);
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  padding: 0 10px 7px 0; border-bottom: 1px solid var(--baseline); white-space: nowrap;
}
table.data td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--gridline); vertical-align: top; }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr:hover td { background: var(--surface-sunken); }
.scroll-x { overflow-x: auto; }

details.tableview { margin-top: 4px; }
details.tableview summary {
  cursor: pointer; font-size: 12.5px; color: var(--text-secondary);
  padding: 6px 0; list-style: revert;
}
details.tableview summary:hover { color: var(--text-primary); }

.empty { color: var(--text-muted); font-size: 13px; padding: 10px 0; }

/* ---------- tooltip ---------- */

#tip {
  position: fixed; z-index: 50; pointer-events: none; opacity: 0;
  transition: opacity 0.1s ease; max-width: 300px;
  background: var(--surface); color: var(--text-primary);
  border: 1px solid var(--baseline); border-radius: 8px;
  padding: 9px 11px; font-size: 12.5px; line-height: 1.45;
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.16);
}
#tip.on { opacity: 1; }
#tip .t-title { font-weight: 600; margin-bottom: 5px; }
#tip .t-row { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
#tip .t-row .lhs { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
#tip .t-row .rhs { font-variant-numeric: tabular-nums; }

footer.foot { color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 28px; }

@media (max-width: 720px) {
  .epic-head { grid-template-columns: 16px 1fr 56px; }
  .epic-head .barcell { grid-column: 2 / -1; }
  .epic-head .size { display: none; }
  .story-head { grid-template-columns: 12px 1fr 60px; }
  .story-head .status-chip, .story-head .who { display: none; }
  .subtask { grid-template-columns: 1fr auto; }
  .subtask .who { display: none; }
}

@media print {
  body { background: #fff; }
  .controls, .btn, #tip { display: none !important; }
  .card, .kpi { break-inside: avoid; border-color: #ccc; }
  .detail { display: block !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="project-name">Jira portfolio status</h1>
      <p class="subtitle">
        <span id="meta-scope"></span>
      </p>
    </div>
    <button class="btn" id="theme-toggle" type="button" title="Switch between light and dark">Theme</button>
  </header>

  <!-- One button per configured view; hidden when the report has only the base view. -->
  <nav class="views" id="views" aria-label="Views" hidden></nav>

  <!-- The headline: the widest block on the page, aligned with the cards below it. -->
  <section class="overall" id="overall"></section>

  <section class="kpis" id="kpis"></section>

  <section class="card">
    <h2>Epics by progress</h2>
    <p class="hint" id="hero-hint"></p>

    <div class="controls">
      <input type="search" id="filter" placeholder="Filter epics, stories and subtasks..." aria-label="Filter issues">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="completion">Least complete first</option>
        <option value="completion-desc">Most complete first</option>
        <option value="size">Largest first</option>
        <option value="stalled">Most stalled first</option>
        <option value="key">By key</option>
      </select>
      <button class="btn" id="scale-toggle" type="button" aria-pressed="true"
              title="Scale each bar's length by the size of the epic">Scale bars by size</button>
      <button class="btn" id="expand-all" type="button">Expand all</button>
      <button class="btn" id="collapse-all" type="button">Collapse all</button>
    </div>

    <div class="controls legend" id="legend">
      <span class="item"><span class="swatch done"></span>Done</span>
      <span class="item"><span class="swatch inprogress"></span>In progress</span>
      <span class="item"><span class="swatch todo"></span>To do</span>
    </div>

    <div id="epics"></div>
    <p class="empty" id="epics-empty" hidden>Nothing matches that filter.</p>

    <details class="tableview">
      <summary>View as a table</summary>
      <div class="scroll-x">
        <table class="data" id="epic-table">
          <thead>
            <tr>
              <th>Epic</th><th>Summary</th><th>Status</th>
              <th class="num">Size</th><th class="num">Done</th>
              <th class="num">In progress</th><th class="num">To do</th><th class="num">Complete</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </details>
  </section>

  <footer class="foot" id="footer"></footer>
</div>

<div id="tip" role="tooltip" aria-hidden="true"></div>

<!-- The analysis payload. The console app replaces the marker below with JSON; left as-is the
     page renders an empty state, so the template can be opened directly while editing it. -->
<script type="application/json" id="jiraviz-data">/*__JIRAVIZ_DATA__*/</script>

<script>
(function () {
  "use strict";

  // ---- data -----------------------------------------------------------------

  var DATA = null;
  try {
    var raw = document.getElementById("jiraviz-data").textContent.trim();
    if (raw && raw.charAt(0) === "{") DATA = JSON.parse(raw);
  } catch (err) {
    console.error("Could not parse the embedded report data.", err);
  }

  if (!DATA) {
    document.querySelector(".wrap").innerHTML =
      "<h1>Jira portfolio status</h1><p>This is the report template. Run the JiraViz " +
      "console app to produce a report with data in it.</p>";
    return;
  }

  var BUCKETS = ["Done", "InProgress", "NotStarted"];
  var BUCKET_CLASS = { Done: "done", InProgress: "inprogress", NotStarted: "todo" };
  var BUCKET_LABEL = { Done: "Done", InProgress: "In progress", NotStarted: "To do" };

  // ---- small helpers --------------------------------------------------------

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function pct(value) { return Math.round(value * 100) + "%"; }

  function num(value) {
    var rounded = Math.round(value * 10) / 10;
    return String(rounded);
  }

  // Per-view state. Reassigned by selectView, so every helper below reads the active view.
  var VIEW, MODEL, t, UNIT, maxSize;

  function size(value) { return num(value) + " " + UNIT; }

  // An epic where nobody estimated is sized by counting its issues, so it must not claim to be
  // measured in points merely because other epics in the report were.
  function unitFor(epic) { return epic.unestimated ? "issues" : UNIT; }
  function sizeOf(epic, value) { return num(value) + " " + unitFor(epic); }

  function browseUrl(key) { return MODEL.jiraBaseUrl + "/browse/" + encodeURIComponent(key); }

  function issueLink(key) {
    return '<a class="key" href="' + esc(browseUrl(key)) + '" target="_blank" rel="noopener">' +
      esc(key) + "</a>";
  }

  function statusChip(bucket, statusName) {
    return '<span class="status-chip"><span class="swatch ' + BUCKET_CLASS[bucket] + '"></span>' +
      esc(statusName || BUCKET_LABEL[bucket]) + "</span>";
  }

  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function daysSince(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }

  // ---- progress bars ---------------------------------------------------------

  // The bar is the main object on the page, so it is drawn tall enough to carry values inside it.
  var EPIC_BAR_HEIGHT = 30;

  // Bar length is proportional to the epic's workload. Below this floor a bar is too short to
  // read its own split, so the smallest epics stop shrinking; everything above stays linear.
  var MIN_BAR_WIDTH_PCT = 12;

  // Segments are emitted only when non-zero, so the 2px gaps never appear as
  // stray slivers on an epic that is entirely in one bucket.
  function barHtml(parts, total, height) {
    if (!(total > 0)) return '<div class="track" style="height:' + (height || 20) + 'px"></div>';

    var segments = "";
    BUCKETS.forEach(function (bucket) {
      var value = parts[bucket] || 0;
      if (value <= 0) return;

      var share = (value / total) * 100;

      // A value is printed inside a segment only where it genuinely fits: a narrow sliver
      // or a shallow bar would clip it, which reads worse than no label at all.
      var label = (share > 12 && height >= 20)
        ? '<span class="lab">' + num(value) + "</span>"
        : "";

      segments += '<div class="seg ' + BUCKET_CLASS[bucket] + '" style="width:' +
        share.toFixed(4) + '%">' + label + "</div>";
    });

    return '<div class="track" style="height:' + height + 'px"><div class="bar">' +
      segments + "</div></div>";
  }

  // ---- header & KPIs --------------------------------------------------------

  function renderMeta() {
    document.getElementById("meta-scope").innerHTML =
      "<code>" + esc(VIEW.jql) + "</code> &middot; generated " + esc(formatDate(DATA.generatedAt)) +
      " &middot; sized by " + (MODEL.countBasedSizing ? "issue count" : "story points");

    document.getElementById("hero-hint").textContent = MODEL.countBasedSizing
      ? "No story points were found, so every issue counts as one. Bar length is the number of issues in the epic."
      : "Bar length is the size of the epic and the fill is how much of it is finished. Stories earn partial credit from their subtasks.";
  }

  // ---- overall headline -------------------------------------------------------

  // Its own renderer rather than the shared bar: at this size each segment can carry its own
  // share and value, which is the whole split of the project in one glance.
  function overallBarHtml() {
    var parts = { Done: t.doneSize, InProgress: t.inProgressSize, NotStarted: t.notStartedSize };
    var segments = "";

    BUCKETS.forEach(function (bucket) {
      var value = parts[bucket] || 0;
      if (value <= 0) return;

      var share = (value / t.size) * 100;

      // Wide segments carry their name and value; narrow ones keep just the share, so a thin
      // sliver is still explained rather than left as an unlabelled band of colour.
      var label = "";
      if (share > 9) {
        label = '<span class="lab"><b>' + Math.round(share) + "%</b>" +
          "<span>" + BUCKET_LABEL[bucket] + " &middot; " + size(value) + "</span></span>";
      } else if (share > 2.5) {
        label = '<span class="lab"><b>' + Math.round(share) + "%</b></span>";
      }

      segments += '<div class="seg ' + BUCKET_CLASS[bucket] + '" style="width:' +
        share.toFixed(3) + '%">' + label + "</div>";
    });

    return '<div class="track" style="height:48px"><div class="bar">' + segments + "</div></div>";
  }

  function renderHeadline() {
    document.getElementById("overall").innerHTML =
      '<div class="overall-head">' +
        '<span class="overall-label">Overall complete</span>' +
        '<span class="overall-pct">' + pct(t.completion) + "</span>" +
        '<span class="overall-meta">' + (t.issueCount === 0
          ? "Nothing matches this view"
          : size(t.doneSize) + " of " + size(t.size) + " finished") + "</span>" +
      "</div>" +
      (t.size > 0 ? overallBarHtml() : '<div class="track" style="height:48px"></div>');
  }

  function renderKpis() {
    var kpiHtml = "";

    kpiHtml += '<div class="kpi"><div class="label">Epics</div>' +
      '<div class="value">' + t.epicCount + "</div>" +
      '<div class="note">' + t.epicsDone + " finished &middot; " + t.issueCount + " issues in scope</div></div>";

    kpiHtml += '<div class="kpi"><div class="label">Not started</div>' +
      '<div class="value">' + t.epicsNotStarted + "</div>" +
      '<div class="note">epic' + (t.epicsNotStarted === 1 ? "" : "s") + " with no work finished</div></div>";

    kpiHtml += '<div class="kpi"><div class="label">Stalled</div>' +
      '<div class="value">' + t.stalledCount + "</div>" +
      '<div class="note">in progress, untouched ' + MODEL.stalledDays + "+ days</div></div>";

    document.getElementById("kpis").innerHTML = kpiHtml;
  }

  // ---- epic list ------------------------------------------------------------

  var epicsEl = document.getElementById("epics");
  var scaleBars = true;

  function badgesHtml(epic) {
    var out = "";
    if (epic.atRisk) out += '<span class="badge risk"><span class="dot"></span>At risk</span>';
    if (epic.notStarted && epic.size > 0 && !epic.atRisk)
      out += '<span class="badge risk"><span class="dot"></span>Not started</span>';
    if (epic.completion >= 0.999 && epic.size > 0)
      out += '<span class="badge complete"><span class="dot"></span>Complete</span>';
    if (epic.stalledCount > 0)
      out += '<span class="badge stalled"><span class="dot"></span>' + epic.stalledCount + " stalled</span>";
    if (epic.unestimated)
      out += '<span class="badge unestimated"><span class="dot"></span>Unestimated</span>';
    return out ? '<span class="badges">' + out + "</span>" : "";
  }

  function subtaskHtml(subtask) {
    return '<div class="subtask">' +
      '<div class="title">' + issueLink(subtask.key) +
        '<span class="summary">' + esc(subtask.summary) + "</span></div>" +
      "<div>" + statusChip(subtask.bucket, subtask.status) +
        (subtask.stalled ? ' <span class="badge stalled"><span class="dot"></span>stalled</span>' : "") +
      "</div>" +
      '<div class="who">' + esc(subtask.assignee || "") + "</div>" +
      "</div>";
  }

  // Everyone involved in a story: its own assignee first, then every subtask assignee,
  // de-duplicated. Work at this level is rarely one person's, and showing only the story
  // assignee hides who is actually doing it.
  function peopleOn(story) {
    var seen = Object.create(null);
    var names = [];

    [story.assignee].concat(story.subtasks.map(function (s) { return s.assignee; }))
      .forEach(function (name) {
        if (!name || seen[name]) return;
        seen[name] = true;
        names.push(name);
      });

    return names;
  }

  function peopleHtml(story) {
    var names = peopleOn(story);
    if (names.length === 0) return "";

    // Past two names the column would only truncate, so summarise the tail instead.
    // The full list stays available on hover.
    var shown = names.length <= 2
      ? names.join(", ")
      : names[0] + ", " + names[1] + " +" + (names.length - 2);

    return '<span class="who" title="' + esc(names.join(", ")) + '">' + esc(shown) + "</span>";
  }

  function storyHtml(story, index) {
    var hasSubtasks = story.subtasks.length > 0;
    var doneCount = story.subtasks.filter(function (s) { return s.bucket === "Done"; }).length;

    var meta = hasSubtasks
      ? doneCount + " of " + story.subtasks.length + " subtasks done"
      : (story.points != null ? num(story.points) + " " + UNIT : "unestimated");

    return '<div class="story" data-story="' + index + '">' +
      '<div class="story-head' + (hasSubtasks ? " expandable" : "") + '"' +
        (hasSubtasks ? ' role="button" tabindex="0" aria-expanded="false"' : "") + ">" +
        '<span class="chev">' + (hasSubtasks ? "&#9656;" : "") + "</span>" +
        '<span class="title">' + issueLink(story.key) +
          '<span class="summary">' + esc(story.summary) + "</span>" +
          (story.stalled ? String.fromCharCode(32) + "<span class=\"badge stalled\"><span class=\"dot\"></span>stalled</span>" : "") +
          '<span class="who" style="flex:none;font-size:11.5px">' + esc(meta) + '</span>' +
        "</span>" +
        "<span>" + statusChip(story.bucket, story.status) + "</span>" +
        peopleHtml(story) +
        '<span class="pct">' + pct(story.completion) + "</span>" +
      "</div>" +
      '<div class="subtasks">' + story.subtasks.map(subtaskHtml).join("") + "</div>" +
      "</div>";
  }

  function epicHtml(epic, index) {
    // Only the baseline treatment spends bar length on epic size; the others are full width.
    var widthPct = scaleBars
      ? Math.max((epic.size / maxSize) * 100, MIN_BAR_WIDTH_PCT)
      : 100;
    var parts = { Done: epic.doneSize, InProgress: epic.inProgressSize, NotStarted: epic.notStartedSize };

    return '<div class="epic" data-epic="' + index + '">' +
      '<div class="epic-head" role="button" tabindex="0" aria-expanded="false">' +
        '<span class="chev">&#9656;</span>' +
        '<span class="epic-name">' +
          '<span class="key">' + esc(epic.isSynthetic ? "" : epic.key) + "</span>" +
          badgesHtml(epic) +
          '<span class="summary">' + esc(epic.summary) + "</span>" +
        "</span>" +
        '<span class="barcell" data-tip="' + index + '">' +
          '<span class="scaler" style="display:block;width:' + widthPct.toFixed(2) + '%">' +
            barHtml(parts, epic.size, EPIC_BAR_HEIGHT) +
          "</span>" +
        "</span>" +
        '<span class="pct">' + pct(epic.completion) + "</span>" +
        '<span class="size">' + sizeOf(epic, epic.size) + "</span>" +
      "</div>" +
      '<div class="detail">' + epic.stories.map(storyHtml).join("") +
        (epic.stories.length === 0 ? '<p class="empty">No stories in this epic.</p>' : "") +
      "</div></div>";
  }

  // ---- filtering & sorting --------------------------------------------------

  var filterText = "";
  var sortMode = "completion";

  function matches(epic) {
    if (!filterText) return true;
    var needle = filterText.toLowerCase();

    if ((epic.key + " " + epic.summary).toLowerCase().indexOf(needle) !== -1) return true;

    return epic.stories.some(function (story) {
      if ((story.key + " " + story.summary).toLowerCase().indexOf(needle) !== -1) return true;
      return story.subtasks.some(function (subtask) {
        return (subtask.key + " " + subtask.summary).toLowerCase().indexOf(needle) !== -1;
      });
    });
  }

  var SORTERS = {
    "completion": function (a, b) { return a.completion - b.completion || b.size - a.size; },
    "completion-desc": function (a, b) { return b.completion - a.completion || b.size - a.size; },
    "size": function (a, b) { return b.size - a.size; },
    "stalled": function (a, b) { return b.stalledCount - a.stalledCount || a.completion - b.completion; },
    "key": function (a, b) { return a.key.localeCompare(b.key, undefined, { numeric: true }); }
  };

  // Rendering rebuilds the list wholesale, which keeps sort and filter honest;
  // open rows are restored by key so expanding an epic then sorting is not jarring.
  var openEpics = Object.create(null);

  function render() {
    var visible = MODEL.epics.filter(matches).slice().sort(SORTERS[sortMode]);

    epicsEl.innerHTML = visible.map(function (epic) {
      return epicHtml(epic, MODEL.epics.indexOf(epic));
    }).join("");

    var emptyEl = document.getElementById("epics-empty");
    emptyEl.hidden = visible.length > 0;
    emptyEl.textContent = MODEL.epics.length === 0
      ? "Nothing matches this view."
      : "Nothing matches that filter.";

    Array.prototype.forEach.call(epicsEl.querySelectorAll(".epic"), function (node) {
      var epic = MODEL.epics[Number(node.dataset.epic)];
      if (openEpics[epic.key]) {
        node.classList.add("open");
        node.querySelector(".epic-head").setAttribute("aria-expanded", "true");
      }
    });
  }

  // ---- interaction ----------------------------------------------------------

  function toggleEpic(node) {
    var epic = MODEL.epics[Number(node.dataset.epic)];
    var isOpen = node.classList.toggle("open");
    openEpics[epic.key] = isOpen;
    node.querySelector(".epic-head").setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  epicsEl.addEventListener("click", function (event) {
    // Issue keys are real links; let them through rather than toggling the row.
    if (event.target.closest("a")) return;

    var storyHead = event.target.closest(".story-head.expandable");
    if (storyHead) {
      var story = storyHead.parentNode;
      var open = story.classList.toggle("open");
      storyHead.setAttribute("aria-expanded", open ? "true" : "false");
      return;
    }

    var epicHead = event.target.closest(".epic-head");
    if (epicHead) toggleEpic(epicHead.parentNode);
  });

  epicsEl.addEventListener("keydown", function (event) {
    if (event.key !== "Enter" && event.key !== " ") return;
    var head = event.target.closest(".epic-head, .story-head.expandable");
    if (!head) return;
    event.preventDefault();
    head.click();
  });

  document.getElementById("filter").addEventListener("input", function (event) {
    filterText = event.target.value.trim();
    render();
  });

  document.getElementById("sort").addEventListener("change", function (event) {
    sortMode = event.target.value;
    render();
  });

  document.getElementById("scale-toggle").addEventListener("click", function (event) {
    scaleBars = !scaleBars;
    event.currentTarget.setAttribute("aria-pressed", scaleBars ? "true" : "false");
    render();
  });

  document.getElementById("expand-all").addEventListener("click", function () {
    MODEL.epics.forEach(function (epic) { openEpics[epic.key] = true; });
    render();
  });

  document.getElementById("collapse-all").addEventListener("click", function () {
    openEpics = Object.create(null);
    render();
  });

  // ---- tooltip --------------------------------------------------------------

  var tip = document.getElementById("tip");

  function tipRow(bucket, value, total, unit) {
    return '<div class="t-row"><span class="lhs"><span class="swatch ' + BUCKET_CLASS[bucket] +
      '"></span>' + BUCKET_LABEL[bucket] + '</span><span class="rhs">' + (num(value) + " " + unit) +
      " &middot; " + (total > 0 ? pct(value / total) : "0%") + "</span></div>";
  }

  epicsEl.addEventListener("mouseover", function (event) {
    var cell = event.target.closest(".barcell");
    if (!cell) return;

    var epic = MODEL.epics[Number(cell.dataset.tip)];
    tip.innerHTML = '<div class="t-title">' + esc(epic.summary) + "</div>" +
      tipRow("Done", epic.doneSize, epic.size, unitFor(epic)) +
      tipRow("InProgress", epic.inProgressSize, epic.size, unitFor(epic)) +
      tipRow("NotStarted", epic.notStartedSize, epic.size, unitFor(epic)) +
      '<div class="t-row" style="margin-top:5px"><span class="lhs">' + epic.stories.length +
      " stories</span><span class=\"rhs\">" + sizeOf(epic, epic.size) + "</span></div>";
    tip.classList.add("on");
    tip.setAttribute("aria-hidden", "false");
  });

  epicsEl.addEventListener("mouseout", function (event) {
    if (!event.target.closest(".barcell")) return;
    tip.classList.remove("on");
    tip.setAttribute("aria-hidden", "true");
  });

  document.addEventListener("mousemove", function (event) {
    if (!tip.classList.contains("on")) return;
    var pad = 14;
    var x = Math.min(event.clientX + pad, window.innerWidth - tip.offsetWidth - 8);
    var y = Math.min(event.clientY + pad, window.innerHeight - tip.offsetHeight - 8);
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = Math.max(8, y) + "px";
  });

  // ---- tables ---------------------------------------------------------------

  function renderTable() {
    document.querySelector("#epic-table tbody").innerHTML = MODEL.epics.map(function (epic) {
    return "<tr>" +
      "<td>" + (epic.isSynthetic ? "&mdash;" : issueLink(epic.key)) + "</td>" +
      "<td>" + esc(epic.summary) + "</td>" +
      "<td>" + esc(epic.isSynthetic ? "" : epic.status) + "</td>" +
      '<td class="num">' + num(epic.size) + "</td>" +
      '<td class="num">' + num(epic.doneSize) + "</td>" +
      '<td class="num">' + num(epic.inProgressSize) + "</td>" +
      '<td class="num">' + num(epic.notStartedSize) + "</td>" +
      '<td class="num">' + pct(epic.completion) + "</td>" +
      "</tr>";
    }).join("");
  }

  function renderFooter() {
    document.getElementById("footer").innerHTML =
      "JiraViz &middot; " + t.issueCount + " issues from " + esc(MODEL.jiraBaseUrl);
  }

  // ---- theme ----------------------------------------------------------------

  // The head script always stamps data-theme (dark unless a light choice was saved),
  // so the toggle is a straight flip with no OS-preference guesswork.
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("jiraviz-theme", next); } catch (err) { /* private mode */ }
  });

  // ---- views ------------------------------------------------------------------

  var VIEW_KEY = "jiraviz-view";

  function renderViewPills(activeIndex) {
    var nav = document.getElementById("views");

    // A single view means the base query only; a switcher of one is just noise.
    if (DATA.views.length < 2) { nav.hidden = true; return; }

    nav.hidden = false;
    nav.innerHTML = DATA.views.map(function (v, i) {
      var vt = v.model.totals;
      var empty = vt.issueCount === 0;
      var note = empty ? "empty" : pct(vt.completion);

      // The same bar the rest of the page uses, just shrunk: one visual language throughout.
      var bar = vt.size > 0
        ? barHtml({ Done: vt.doneSize, InProgress: vt.inProgressSize, NotStarted: vt.notStartedSize }, vt.size, 6)
        : '<div class="track" style="height:6px"></div>';

      return '<button type="button" class="view-pill' + (empty ? " is-empty" : "") +
        '" data-view="' + i + '" aria-pressed="' + (i === activeIndex ? "true" : "false") + '">' +
        '<span class="vp-top">' + esc(v.name) + '<span class="vp-pct">' + note + "</span></span>" +
        bar +
        "</button>";
    }).join("");
  }

  function selectView(index) {
    VIEW = DATA.views[index];
    MODEL = VIEW.model;
    t = MODEL.totals;
    UNIT = MODEL.countBasedSizing ? "issues" : "pts";
    maxSize = MODEL.epics.reduce(function (acc, e) { return Math.max(acc, e.size); }, 0) || 1;

    // Remembered by name rather than index, so a changed config cannot land the reader on
    // a different milestone than the one they left open.
    try { localStorage.setItem(VIEW_KEY, VIEW.name); } catch (err) { /* private mode */ }

    renderViewPills(index);
    renderMeta();
    renderHeadline();
    renderKpis();
    renderTable();
    renderFooter();
    render();
  }

  document.getElementById("views").addEventListener("click", function (event) {
    var pill = event.target.closest(".view-pill");
    if (pill) selectView(Number(pill.dataset.view));
  });

  if (DATA.projectName) {
    document.getElementById("project-name").textContent = DATA.projectName;
    document.title = DATA.projectName + " - portfolio status";
  }

  var startIndex = 0;
  try {
    var savedView = localStorage.getItem(VIEW_KEY);
    for (var i = 0; i < DATA.views.length; i++) {
      if (DATA.views[i].name === savedView) { startIndex = i; break; }
    }
  } catch (err) { /* storage unavailable; start on the base view */ }

  selectView(startIndex);
})();
</script>
</body>
</html>
